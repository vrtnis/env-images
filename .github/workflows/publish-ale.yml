name: publish-ale

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/ale/**
      - .github/workflows/publish-ale.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/vrtnis/ale:0.12.0 \
            images/ale

      - name: Smoke test image
        run: |
          docker run --rm ghcr.io/vrtnis/ale:0.12.0 python -c "import gymnasium as gym; import ale_py; gym.register_envs(ale_py); env = gym.make('ALE/Breakout-v5', obs_type='rgb'); obs, info = env.reset(seed=0); obs, reward, terminated, truncated, info = env.step(env.action_space.sample()); assert obs.shape == (210, 160, 3); env.close(); print('ok', obs.shape, reward, terminated, truncated)"

      - name: Push image
        run: docker push ghcr.io/vrtnis/ale:0.12.0
