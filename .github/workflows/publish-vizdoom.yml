name: publish-vizdoom

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/vizdoom/**
      - .github/workflows/publish-vizdoom.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/vrtnis/vizdoom:1.3.0 \
            images/vizdoom

      - name: Smoke test image
        run: |
          docker run --rm ghcr.io/vrtnis/vizdoom:1.3.0 python -c "from pathlib import Path; import vizdoom as vzd; game = vzd.DoomGame(); game.load_config(str(Path(vzd.scenarios_path) / 'basic.cfg')); game.set_window_visible(False); game.init(); state = game.get_state(); assert state is not None; screen = state.screen_buffer; reward = game.make_action([1, 0, 0]); assert screen.shape == (3, 240, 320); game.close(); print('ok', screen.shape, reward)"

      - name: Push image
        run: docker push ghcr.io/vrtnis/vizdoom:1.3.0
