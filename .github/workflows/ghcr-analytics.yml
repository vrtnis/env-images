name: ghcr-analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write
  packages: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect GHCR package analytics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect_ghcr_analytics.py

      - name: Commit analytics snapshot
        run: |
          if git diff --quiet analytics/ghcr; then
            echo "No analytics changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/ghcr
          git commit -m "Update GHCR analytics"
          git push
